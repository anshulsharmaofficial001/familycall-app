name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          accept-android-sdk-licenses: true

      - name: Install NDK and build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyCall-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "FamilyCall v${{ github.run_number }}"
          body: |
            ## 📱 FamilyCall Android APK
            
            ### Install करने के Steps:
            1. नीचे **app-debug.apk** download करो
            2. Phone में **Settings → Security → Unknown Sources** ON करो
               (या Settings → Apps → Special Access → Install Unknown Apps → Chrome → Allow)
            3. Downloaded APK tap करके install करो
            4. Done! 🎉
            
            ### Features:
            - 📞 Voice Calling (both sides)
            - 💬 Chat & Voice Notes  
            - 👨‍👩‍👧‍👦 Family Groups
            - 📍 Live Location
            - 🆘 SOS Emergency
            - 🔋 Battery Monitor
            - 🎙️ Voice Status
            - 🎂 Birthday Alerts
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
