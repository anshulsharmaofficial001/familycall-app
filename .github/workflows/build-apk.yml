name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FamilyCall-latest.apk

      - name: Upload APK as artifact (90 days)
        uses: actions/upload-artifact@v4
        with:
          name: FamilyCall-v${{ github.run_number }}-apk
          path: FamilyCall-latest.apk
          retention-days: 90

      - name: Delete old 'latest' release if exists
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create latest Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "FamilyCall Latest (v${{ github.run_number }})"
          body: |
            ## 📱 FamilyCall Android APK — Auto Update

            **Build:** v${{ github.run_number }}

            ### 📥 Install / Update करने के Steps:
            1. नीचे **FamilyCall-latest.apk** पर click करो
            2. Download होने पर tap करके install करो
            3. अगर "Unknown Sources" माँगे — Settings में Allow करो
            4. Install हो जाएगा — पुरानी app automatically update हो जाएगी ✅

            ### ✨ Features:
            - 📞 Voice Calling (dono taraf)
            - 💬 Chat + Voice Notes
            - 👨‍👩‍👧‍👦 Family Groups
            - 📍 Live Location Map
            - 🆘 SOS Emergency Alert
            - 🔋 Battery Monitor
            - 🎙️ Voice Status (24hr)
            - 🎂 Birthday Alerts
            - 🔄 Auto-Update System
          files: FamilyCall-latest.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
