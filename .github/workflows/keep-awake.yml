name: Keep Render Awake

on:
  schedule:
    - cron: '*/10 * * * *'

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render server
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://familycall-server-tpyh.onrender.com/ping)
          echo "Server ping status: $STATUS"
