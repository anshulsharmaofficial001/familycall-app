<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#2C6FAC"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="url(#bg)"/>
  <!-- White soft circle -->
  <circle cx="96" cy="96" r="80" fill="rgba(255,255,255,0.1)"/>
  <!-- House shape (family home) -->
  <polygon points="96,40 148,80 148,145 44,145 44,80" fill="white" opacity="0.95"/>
  <!-- Roof -->
  <polygon points="96,30 158,82 34,82" fill="#FFB347"/>
  <!-- Door -->
  <rect x="82" y="108" width="28" height="37" rx="14" fill="#4A90D9"/>
  <!-- Window left -->
  <rect x="54" y="95" width="20" height="20" rx="4" fill="#E8F4FF"/>
  <line x1="64" y1="95" x2="64" y2="115" stroke="#4A90D9" stroke-width="1.5"/>
  <line x1="54" y1="105" x2="74" y2="105" stroke="#4A90D9" stroke-width="1.5"/>
  <!-- Window right -->
  <rect x="120" y="95" width="20" height="20" rx="4" fill="#E8F4FF"/>
  <line x1="130" y1="95" x2="130" y2="115" stroke="#4A90D9" stroke-width="1.5"/>
  <line x1="120" y1="105" x2="140" y2="105" stroke="#4A90D9" stroke-width="1.5"/>
  <!-- Phone icon on door -->
  <text x="96" y="134" text-anchor="middle" font-size="16" fill="white">📞</text>
  <!-- Small hearts -->
  <text x="30" y="55" font-size="18" fill="#FF6B6B" opacity="0.8">♥</text>
  <text x="152" y="55" font-size="18" fill="#FF6B6B" opacity="0.8">♥</text>
  <!-- App name -->
  <text x="96" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white" opacity="0.9">FamilyCall</text>
</svg>
